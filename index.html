<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GasPass Driver Portal - Lagos CNG Queue Management</title>
    <style>
        :root {
            --primary: #10b981;
            --dark: #0f172a;
            --light: #f8fafc;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 16px;
        }
        h1 { margin: 0; color: var(--primary); font-size: 28px; }
        .station-card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            background: #fafafa;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            background: #d1fae5;
            color: #065f46;
        }
        .metric-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0;
        }
        .metric {
            background: white;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .metric label { font-size: 12px; color: #64748b; display: block; }
        .metric span { font-size: 18px; font-weight: bold; color: var(--dark); }
        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #059669; }
        .booking-status {
            display: none;
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>GasPass ⛽</h1>
        <p style="margin: 4px 0 0; color: #64748b;">Lagos Real-Time CNG Virtual Queue</p>
    </header>

    <div class="station-card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <strong style="font-size: 18px;">NIPCO — Apapa Expressway Axis</strong>
            <span class="status-badge">Pressure Optimal</span>
        </div>
        
        <div class="metric-grid">
            <div class="metric">
                <label>Active Cars in Queue</label>
                <span id="queue-count">42 Vehicles</span>
            </div>
            <div class="metric">
                <label>Estimated Wait Time</label>
                <span id="wait-time">2h 10m</span>
            </div>
        </div>

        <button id="book-btn" onclick="startVirtualQueue()">Book Virtual Slot (₦300)</button>
    </div>

    <div id="status-box" class="booking-status">
        <h3 style="margin: 0 0 8px; color: #1e40af;">Virtual Ticket Active 🎟️</h3>
        <p style="margin: 4px 0;">Your Number: <strong>Ticket #88</strong></p>
        <p id="countdown-text" style="margin: 4px 0; color: #1e3a8a; font-weight: 500;"></p>
    </div>
</div>

<script>
    function startVirtualQueue() {
        document.getElementById('book-btn').disabled = true;
        document.getElementById('book-btn').innerText = "Slot Secured";
        document.getElementById('status-box').style.display = 'block';
        
        let carsAhead = 15;
        let countdownText = document.getElementById('countdown-text');
        
        let interval = setInterval(() => {
            if (carsAhead > 3) {
                carsAhead -= 3;
                countdownText.innerHTML = `Vehicles ahead of you: ${carsAhead}. <br><span style="color: #64748b; font-size: 13px;">Status: Keep driving your Uber/Bolt run...</span>`;
            } else if (carsAhead <= 3 && carsAhead > 0) {
                carsAhead = 0;
                countdownText.innerHTML = `⚠️ <strong>Proximity Alert!</strong> Only ${carsAhead + 1} cars left. Head to NIPCO Apapa Dedicated Digital Lane now!`;
                alert("GasPass Alert: Your turn is approaching! Please head to the station now to minimize wait times.");
                clearInterval(interval);
            }
        }, 3000);
    }
</script>

</body>
</html>
